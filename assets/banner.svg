<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Certifications banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160a24"/>
      <stop offset="45%" stop-color="#2c1250"/>
      <stop offset="100%" stop-color="#42197a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="medalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g fill="#8b5cf6" opacity="0.08">
    <circle cx="60" cy="40" r="2.2"/><circle cx="100" cy="40" r="2.2"/><circle cx="140" cy="40" r="2.2"/>
    <circle cx="60" cy="70" r="2.2"/><circle cx="100" cy="70" r="2.2"/><circle cx="140" cy="70" r="2.2"/>
  </g>

  <!-- certificate document -->
  <g transform="translate(830,60)">
    <rect x="0" y="0" width="160" height="115" rx="6" fill="#2c1250" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="12" y="12" width="136" height="91" rx="3" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="24" y1="28" x2="136" y2="28" stroke="#ddd6fe" stroke-width="3"/>
    <line x1="24" y1="42" x2="110" y2="42" stroke="#a78bfa" stroke-width="2" opacity="0.7"/>
    <line x1="24" y1="54" x2="120" y2="54" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
    <path d="M55,68 l6,10 l16,-16" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- medal with ribbon, overlapping the certificate -->
  <g transform="translate(1010,120)">
    <path d="M-10,-40 L10,-40 L18,10 L0,-2 L-18,10 Z" fill="#6d28d9"/>
    <circle cx="0" cy="20" r="34" fill="url(#medalGrad)"/>
    <circle cx="0" cy="20" r="34" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.4"/>
    <path d="M0,4 l6,13 14,2 -10,10 2,14 -12,-7 -12,7 2,-14 -10,-10 14,-2 z" fill="#f8fafc" opacity="0.9"/>
  </g>

  <text x="150" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    CERTIFICATIONS
  </text>
  <rect x="150" y="164" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="150" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#ddd6fe">
    In Progress &#8226; Completed &#8226; Certificates &#8226; Practice Exams
  </text>
  <text x="150" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c4b5fd">
    Proof of skill, tracked honestly
  </text>

  <text x="1130" y="295" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#8471a8">
    github.com/akxyverse
  </text>
</svg>
